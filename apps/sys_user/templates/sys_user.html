{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>用户管理系统</title>
    <!-- 引入 jQuery 和 字体图标 (Font Awesome) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 引入外部样式文件 -->
    <link rel="stylesheet" href="{% static 'css/sysuser.css' %}?v=20261106b">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=20261106">
</head>
<body>
<div class="user-manager">
    <div class="header">
        <h1><i class="fas fa-users" style="margin-right: 12px;"></i>用户管理</h1>
        <div class="header-right">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="搜索用户ID或用户名">
            </div>
            <button class="btn-refresh" id="refreshBtn" title="刷新数据"><i class="fas fa-sync-alt"></i> 刷新</button>
            <button class="btn-add" id="openAddModalBtn"><i class="fas fa-plus"></i> 新增用户</button>
        </div>
    </div>
    <div class="table-wrapper">
        <table class="user-table" id="userTable">
            <thead>
                <tr>
                    <th>用户ID</th><th>用户名</th><th>PID</th><th>邮箱</th><th>手机号</th><th>地址</th><th>创建时间</th><th>更新时间</th><th width="100">操作</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr class="empty-row"><td colspan="9">加载中...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-wrapper" id="paginationWrapper" style="display: none; margin-top: 20px;">
        <div class="pagination-info" style="float: left; font-size: 0.85rem; color: #6b7280;">
            共 <span id="totalCount">0</span> 条数据，当前第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页
        </div>
        <div class="pagination" style="float: right; display: flex; align-items: center; gap: 6px;">
            <button class="pagination-btn" id="firstPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">首页</button>
            <button class="pagination-btn" id="prevPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">上一页</button>
            <div class="page-numbers" id="pageNumbers" style="display: flex; gap: 4px;"></div>
            <button class="pagination-btn" id="nextPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">下一页</button>
            <button class="pagination-btn" id="lastPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">末页</button>
        </div>
        <div style="clear: both;"></div>
    </div>
</div>

<!-- 模态框：新增/编辑共用 -->
<div id="userModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">新增用户</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="userForm">
                <input type="hidden" id="editUserId" value="">
                <div class="form-row">
                    <div class="form-group">
                        <label>用户名 <span style="color:#e03a3a;">*</span></label>
                        <input type="text" id="user_name" placeholder="请输入用户名" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>密码 <span style="color:#e03a3a;">*</span></label>
                        <input type="password" id="password" placeholder="至少8位，不能是纯数字">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>身份证 <span style="color:#e03a3a;">*</span></label>
                        <input type="number" id="pid" placeholder="请输入身份证号">
                    </div>
                    <div class="form-group">
                        <label>手机号 <span style="color:#e03a3a;">*</span></label>
                        <input type="text" id="mobile" placeholder="请输入手机号">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="email" placeholder="example@domain.com">
                    </div>
                    <div class="form-group">
                        <label>地址</label>
                        <input type="text" id="address" placeholder="详细地址">
                    </div>
                </div>
                <div class="form-group">
                    <label>备注/扩展</label>
                    <textarea id="remarks" placeholder="可选备注信息" rows="2"></textarea>
                    <div class="info-badge"><i class="fas fa-info-circle"></i> 创建时间由系统自动生成</div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" id="cancelModalBtn">取消</button>
            <button type="button" class="btn-submit" id="submitUserBtn">保存</button>
        </div>
    </div>
</div>

<!-- 配置角色模态框 -->
<div id="roleModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3>配置角色</h3>
            <button class="modal-close" id="closeRoleModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="roleUserId" value="">
            <div class="form-group">
                <label>选择角色 <span style="color:#e03a3a;">*</span></label>
                <div id="roleOptionsContainer" style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="text-align: center; color: #9ca3af; padding: 20px;">加载中...</div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" id="cancelRoleModalBtn">取消</button>
            <button type="button" class="btn-submit" id="submitRoleBtn">确认配置</button>
        </div>
    </div>
</div>

<!-- 引入外部脚本文件 -->
<script src="/static/js/auth.js?v=20261109b"></script>
<script src="{% static 'js/sysuser.js' %}?v=20261106b"></script>
</body>
</html>
