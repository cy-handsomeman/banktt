<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>客户信息管理系统</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/userinfo.css?v=20261106">
    <link rel="stylesheet" href="/static/css/theme.css?v=20261106">
</head>
<body>
<div class="user-manager">
    <div class="header">
        <h1><i class="fas fa-users"></i>客户信息管理<span class="readonly-badge{% if can_write_business %} hidden{% endif %}" id="readonlyBadge">只读</span></h1>
        <div class="header-right">
            <button class="btn-refresh" id="refreshBtn" title="刷新数据"><i class="fas fa-sync-alt"></i> 刷新</button>
            <button class="btn-add{% if not can_write_business %} hidden{% endif %}" id="openAddModalBtn"><i class="fas fa-plus"></i> 新增客户</button>
        </div>
    </div>
    <div class="table-wrapper">
        <table class="user-table" id="userTable">
            <thead>
                <tr>
                    <th>客户ID</th><th>开户名</th><th>身份证号</th><th>联系电话</th><th>居住地址</th><th width="100">操作</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr class="empty-row"><td colspan="6">加载中...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-wrapper" id="paginationWrapper" style="display: none;">
        <div class="pagination-info">
            共 <span id="totalCount">0</span> 条数据，当前第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页
        </div>
        <div class="pagination" style="display: flex; align-items: center; gap: 6px;">
            <button class="pagination-btn" id="firstPageBtn">首页</button>
            <button class="pagination-btn" id="prevPageBtn">上一页</button>
            <div class="page-numbers" id="pageNumbers" style="display: flex; gap: 4px;"></div>
            <button class="pagination-btn" id="nextPageBtn">下一页</button>
            <button class="pagination-btn" id="lastPageBtn">末页</button>
        </div>
    </div>
</div>

<div id="userModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">新增客户</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="userForm">
                <input type="hidden" id="editUserId" value="">
                <div class="form-group">
                    <label>开户名 <span style="color:#e03a3a;">*</span></label>
                    <input type="text" id="customer_name" placeholder="请输入开户名" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>身份证号 <span style="color:#e03a3a;">*</span></label>
                    <input type="text" id="pid" placeholder="18位身份证号" maxlength="18">
                </div>
                <div class="form-group">
                    <label>联系电话 <span style="color:#e03a3a;">*</span></label>
                    <input type="text" id="telephone" placeholder="手机号码">
                </div>
                <div class="form-group">
                    <label>居住地址</label>
                    <input type="text" id="address" placeholder="详细地址">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" id="cancelModalBtn">取消</button>
            <button type="button" class="btn-submit" id="submitUserBtn">保存</button>
        </div>
    </div>
</div>

<script src="/static/js/auth.js?v=20261106"></script>
<script>window.__serverCanWrite = {{ can_write_business|yesno:"true,false" }};</script>
<script src="/static/js/userinfo.js?v=20261106b"></script>
</body>
</html>
