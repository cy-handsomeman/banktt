<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>交易信息管理系统</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/tradeinfo.css">
</head>
<body>
<div class="manager">
    <div class="header">
        <h1><i class="fas fa-exchange-alt" style="margin-right: 12px;"></i>交易信息管理</h1>
        <div class="header-right">
            <button class="btn-refresh" id="refreshBtn" title="刷新数据"><i class="fas fa-sync-alt"></i> 刷新</button>
            <button class="btn-add" id="openAddModalBtn"><i class="fas fa-plus"></i> 新增交易</button>
        </div>
    </div>
    <div class="table-wrapper">
        <table class="data-table" id="dataTable">
            <thead>
                <tr>
                    <th>交易ID</th><th>交易类型</th><th>银行卡号</th><th>对方卡号</th><th>交易日期</th><th>交易金额</th><th>交易后余额</th><th>状态</th><th>备注</th><th width="140">操作</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr class="empty-row"><td colspan="10">加载中...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-wrapper" id="paginationWrapper" style="display: none; margin-top: 20px;">
        <div class="pagination-info" style="float: left; font-size: 0.85rem; color: #6b7280;">
            共 <span id="totalCount">0</span> 条数据，当前第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页
        </div>
        <div class="pagination" style="float: right; display: flex; align-items: center; gap: 6px;">
            <button class="pagination-btn" id="firstPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">首页</button>
            <button class="pagination-btn" id="prevPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">上一页</button>
            <div class="page-numbers" id="pageNumbers" style="display: flex; gap: 4px;"></div>
            <button class="pagination-btn" id="nextPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">下一页</button>
            <button class="pagination-btn" id="lastPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">末页</button>
        </div>
        <div style="clear: both;"></div>
    </div>
</div>

<div id="dataModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">新增交易</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="dataForm">
                <input type="hidden" id="editId" value="">
                <div class="form-group">
                    <label>交易类型 <span style="color:#e03a3a;">*</span></label>
                    <select id="trans_type" required>
                        <option value="">请选择交易类型</option>
                        <option value="存款">存款</option>
                        <option value="取款">取款</option>
                        <option value="转账">转账</option>
                        <option value="消费">消费</option>
                        <option value="还款">还款</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>银行卡号 <span style="color:#e03a3a;">*</span></label>
                    <input type="text" id="card_id" placeholder="请输入银行卡号" maxlength="20">
                </div>
                <div class="form-group" id="toCardGroup" style="display: none;">
                    <label>收款卡号 <span style="color:#e03a3a;">*</span></label>
                    <input type="text" id="to_card_id" placeholder="转账时填写收款银行卡号" maxlength="20">
                </div>
                <div class="form-group">
                    <label>交易金额 <span style="color:#e03a3a;">*</span></label>
                    <input type="number" id="trans_money" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label>交易日期</label>
                    <input type="text" id="trans_date_display" value="保存时由系统自动记录" readonly>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="remark" placeholder="可选备注信息">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" id="cancelModalBtn">取消</button>
            <button type="button" class="btn-submit" id="submitBtn">保存</button>
        </div>
    </div>
</div>

<script src="/static/js/auth.js"></script>
<script src="/static/js/tradeinfo.js"></script>
</body>
</html>
