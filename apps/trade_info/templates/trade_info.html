<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>柜面业务</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/tradeinfo.css?v=20261106">
    <link rel="stylesheet" href="/static/css/theme.css?v=20261106">
</head>
<body>
<div class="manager">
    <div class="header">
        <h1><i class="fas fa-exchange-alt"></i>柜面业务<span class="readonly-badge{% if can_write_business %} hidden{% endif %}" id="readonlyBadge">只读</span></h1>
        <div class="header-right">
            <button class="btn-refresh" id="refreshBtn" title="刷新数据"><i class="fas fa-sync-alt"></i> 刷新</button>
            <button class="btn-add{% if not can_write_business %} hidden{% endif %}" id="openAddModalBtn"><i class="fas fa-plus"></i> 新增交易</button>
        </div>
    </div>
    <div class="alert">
        <i class="fas fa-circle-info"></i>
        柜面业务仅支持新增存款、取款与转账流水；交易写入后不可修改或删除，转账自动双边记账。
    </div>
    <div class="table-wrapper">
        <table class="data-table" id="dataTable">
            <thead>
                <tr>
                    <th>交易ID</th><th>交易类型</th><th>银行卡号</th><th>对方卡号</th><th>交易日期</th><th>交易金额</th><th>交易后余额</th><th>备注</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr class="empty-row"><td colspan="8">加载中...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-wrapper" id="paginationWrapper" style="display: none;">
        <div class="pagination-info">
            共 <span id="totalCount">0</span> 条数据，当前第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页
        </div>
        <div class="pagination" style="display: flex; align-items: center; gap: 6px;">
            <button class="pagination-btn" id="firstPageBtn">首页</button>
            <button class="pagination-btn" id="prevPageBtn">上一页</button>
            <div class="page-numbers" id="pageNumbers" style="display: flex; gap: 4px;"></div>
            <button class="pagination-btn" id="nextPageBtn">下一页</button>
            <button class="pagination-btn" id="lastPageBtn">末页</button>
        </div>
    </div>
</div>

<div id="dataModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">新增交易</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="dataForm">
                <div class="form-group">
                    <label>交易类型 <span style="color:#e03a3a;">*</span></label>
                    <select id="trans_type" required>
                        <option value="">请选择交易类型</option>
                        <option value="存款">存款</option>
                        <option value="取款">取款</option>
                        <option value="转账">转账</option>
                        <option value="消费">消费</option>
                        <option value="还款">还款</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>银行卡号 <span style="color:#e03a3a;">*</span></label>
                    <input type="text" id="card_id" placeholder="请输入银行卡号" maxlength="20">
                </div>
                <div class="form-group" id="toCardGroup" style="display: none;">
                    <label>收款卡号 <span style="color:#e03a3a;">*</span></label>
                    <input type="text" id="to_card_id" placeholder="转账时填写收款银行卡号" maxlength="20">
                </div>
                <div class="form-group">
                    <label>交易金额 <span style="color:#e03a3a;">*</span></label>
                    <input type="number" id="trans_money" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label>交易日期</label>
                    <input type="text" id="trans_date_display" value="保存时由系统自动记录" readonly>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="remark" placeholder="可选备注信息">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" id="cancelModalBtn">取消</button>
            <button type="button" class="btn-submit" id="submitBtn">保存</button>
        </div>
    </div>
</div>

<script src="/static/js/auth.js?v=20261106"></script>
<script>window.__serverCanWrite = {{ can_write_business|yesno:"true,false" }};</script>
<script src="/static/js/tradeinfo.js?v=20261106"></script>
</body>
</html>
