<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>银行卡信息管理</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/cardinfo.css">
</head>
<body>
<div class="manager">
    <div class="header">
        <h1><i class="fas fa-credit-card" style="margin-right: 12px;"></i>银行卡信息管理</h1>
        <div class="header-right">
            <button class="btn-refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i> 刷新</button>
            <button class="btn-add" id="openAddModalBtn"><i class="fas fa-plus"></i> 新增银行卡</button>
        </div>
    </div>
    <div class="table-wrapper">
        <table class="data-table" id="dataTable">
            <thead>
                <tr>
                    <th>卡号</th><th>货币类型</th><th>开户日期</th><th>开户金额</th><th>余额</th><th>用户ID</th><th width="100">操作</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr class="empty-row"><td colspan="7">加载中...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-wrapper" id="paginationWrapper" style="display: none; margin-top: 20px;">
        <div class="pagination-info" style="float: left; font-size: 0.85rem; color: #6b7280;">
            共 <span id="totalCount">0</span> 条数据，当前第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页
        </div>
        <div class="pagination" style="float: right; display: flex; align-items: center; gap: 6px;">
            <button class="pagination-btn" id="firstPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">首页</button>
            <button class="pagination-btn" id="prevPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">上一页</button>
            <div class="page-numbers" id="pageNumbers" style="display: flex; gap: 4px;"></div>
            <button class="pagination-btn" id="nextPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">下一页</button>
            <button class="pagination-btn" id="lastPageBtn" style="padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; color: #374151;">末页</button>
        </div>
        <div style="clear: both;"></div>
    </div>
</div>

<div id="dataModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">新增银行卡</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="dataForm">
                <input type="hidden" id="editCardId" value="">
                <div class="form-group">
                    <label>卡号 <span style="color:#e03a3a;">*</span></label>
                    <input type="text" id="card_id" placeholder="请输入银行卡号" maxlength="20">
                </div>
                <div class="form-group">
                    <label>货币类型 <span style="color:#e03a3a;">*</span></label>
                    <select id="cur_type">
                        <option value="">请选择货币类型</option>
                        <option value="人民币">人民币</option>
                        <option value="美元">美元</option>
                        <option value="欧元">欧元</option>
                        <option value="港币">港币</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>开户日期 <span style="color:#e03a3a;">*</span></label>
                        <input type="datetime-local" id="open_date">
                    </div>
                    <div class="form-group">
                        <label>用户ID <span style="color:#e03a3a;">*</span></label>
                        <input type="number" id="customer_id" placeholder="用户编号" min="1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>开户金额 <span style="color:#e03a3a;">*</span></label>
                        <input type="number" id="open_money" placeholder="0.00" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label>余额</label>
                        <input type="number" id="balance" placeholder="开户后由交易自动变动" step="0.01" readonly>
                    </div>
                </div>
                <div class="form-group">
                    <label>密码 <span style="color:#e03a3a;">*</span></label>
                    <input type="password" id="password" placeholder="请输入密码" maxlength="100">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-cancel" id="cancelModalBtn">取消</button>
            <button type="button" class="btn-submit" id="submitBtn">保存</button>
        </div>
    </div>
</div>

<script src="/static/js/auth.js"></script>
<script src="/static/js/cardinfo.js"></script>
</body>
</html>
