<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>银行柜面业务管理平台</title>
    <script src="/static/js/jquery.min.js?v=20261106"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/theme.css?v=20261106">
</head>
<body>
    <!-- 加载中遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">正在加载工作台...</div>
    </div>

    <div class="shell">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="brand">
                <div class="bank">
                    <i class="fas fa-university brand-icon"></i>
                    <span class="brand-title">银行柜面平台</span>
                </div>
                <small>BANK COUNTER SYSTEM</small>
            </div>
            <div class="nav" id="navLinks">
                <!-- 菜单通过 JavaScript 动态渲染 -->
            </div>
            <div class="userbox">
                <div class="avatar" id="sidebarAvatar">-</div>
                <div>
                    <strong id="sidebarUserName">未登录</strong>
                    <small id="sidebarRole">无角色</small>
                </div>
                <button class="logout-icon" onclick="logout()" title="退出登录">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main">
            <header class="topbar">
                <div class="crumb" id="breadcrumb">工作台 / <b>运营总览</b></div>
                <div class="top-right">
                    <div class="date" id="currentDate"></div>
                    <div class="user-dropdown">
                        <button class="top-user" onclick="toggleUserDropdown(); event.stopPropagation();">
                            <span class="avatar" id="topAvatar">-</span>
                            <span id="currentUserName">未登录</span>
                            <i class="fas fa-chevron-down" style="font-size:10px;color:#8b96a2;"></i>
                        </button>
                        <div class="user-dropdown-content">
                            <div class="dropdown-header">
                                <div class="role-label">当前角色</div>
                                <div class="role-value" id="dropdownRoleText">无角色</div>
                                <div class="user-name" id="dropdownUserName">-</div>
                            </div>
                            <div class="dropdown-divider"></div>
                            <div class="dropdown-item" onclick="goToSettings()">
                                <i class="fas fa-cog"></i>
                                <span>系统设置</span>
                            </div>
                            <div class="dropdown-divider"></div>
                            <div class="dropdown-item logout-btn" onclick="logout()">
                                <i class="fas fa-sign-out-alt"></i>
                                <span>退出登录</span>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            <iframe id="contentIframe" class="iframe-container" src="about:blank" frameborder="0"></iframe>
        </main>
    </div>

    <script src="/static/js/auth.js?v=20261109b"></script>
    <script>
        // 用户下拉菜单控制
        function toggleUserDropdown() {
            const dropdown = $('.user-dropdown-content');
            if (dropdown.hasClass('show')) {
                dropdown.stop(true, true).fadeOut(150).removeClass('show');
            } else {
                dropdown.stop(true, true).fadeIn(150).addClass('show');
            }
        }

        function hideUserDropdown() {
            $('.user-dropdown-content').stop(true, true).fadeOut(150).removeClass('show');
        }

        // 用户权限信息
        let userPermissions = {
            roles: [],
            role_names_str: '无角色',
            is_super_admin: false,
            menu: []
        };

        function updateRoleDisplay(roleText) {
            $('#dropdownRoleText').text(roleText);
            $('#sidebarRole').text(roleText);
        }

        function updateUserNameDisplay(userName) {
            const name = userName || '未登录';
            $('#currentUserName').text(name);
            $('#dropdownUserName').text(name);
            $('#sidebarUserName').text(name);
            const initial = name === '未登录' ? '-' : name.trim().charAt(0).toUpperCase();
            $('#topAvatar').text(initial);
            $('#sidebarAvatar').text(initial);
        }

        // 转义数据库内容，避免菜单名/图标里的 HTML 被当作标签执行
        function escapeHtml(value) {
            return String(value === null || value === undefined ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 菜单地址只允许同源相对路径，拒绝 //evil.com、/\evil.com 与 javascript: 等写法
        function safeMenuUrl(url) {
            const value = String(url || '').trim();
            if (!value || value.charAt(0) !== '/' || /^\/[\/\\]/.test(value)) {
                return null;
            }
            return value;
        }

        // 日期显示
        function updateCurrentDate() {
            const now = new Date();
            const week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
            $('#currentDate').text(
                `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${week}`
            );
        }

        // 获取用户菜单
        function loadUserMenu() {
            // 页面能打开（Cookie 有效）不代表接口可用，仍以 sessionStorage 里的 token 为准
            if (!sessionStorage.getItem('access_token')) {
                window.location.href = '/login/';
                return Promise.resolve();
            }

            // 后端按 request.user 取菜单，不接受客户端传入的 user_id
            return $.ajax({
                url: '/api/get_user_menu/',
                method: 'GET'
            }).then(response => {
                userPermissions = {
                    roles: response.user_roles || [],
                    role_names_str: response.role_names_str || '无角色',
                    is_super_admin: response.is_super_admin || false,
                    menu: response.menu || []
                };
                updateRoleDisplay(userPermissions.role_names_str);
                renderMenu();
            }).catch(err => {
                console.error('获取用户菜单失败:', err);
                updateRoleDisplay('无角色');
                renderEmptyMenu('菜单加载失败，请刷新页面重试');
                showToast(window.parseApiError ? parseApiError(err, '菜单加载失败') : '菜单加载失败', 2500);
            });
        }

        // 渲染菜单
        function renderMenu() {
            const container = $('#navLinks');
            let html = '';

            // 菜单为空说明该账号没有任何授权菜单，如实提示而不是伪造一套菜单
            if (!userPermissions.menu || userPermissions.menu.length === 0) {
                renderEmptyMenu('当前账号未分配任何菜单，请联系管理员授权');
                return;
            }

            userPermissions.menu.forEach((group, groupIndex) => {
                const isLocked = group.locked || false;
                // 展开高度按菜单项数量计算，避免固定 200px 裁掉第 5 项以后的菜单
                const expandedHeight = Math.max(200, group.items.length * 51 + 10);
                html += `
                    <div class="nav-group">
                        <div class="group ${isLocked ? 'locked' : ''}" data-group-index="${groupIndex}" data-locked="${isLocked}">
                            ${escapeHtml(group.group)}${isLocked ? ' <i class="fas fa-lock" style="font-size:10px;margin-left:4px;"></i>' : ''}
                        </div>
                        <div class="nav-group-content ${isLocked ? 'collapsed locked' : 'expanded'}"
                             data-expanded-height="${expandedHeight}"${isLocked ? '' : ` style="max-height:${expandedHeight}px"`}>
                `;
                group.items.forEach(item => {
                    html += `
                        <div class="item" data-group="${escapeHtml(group.group)}" data-title="${escapeHtml(item.title)}"
                             data-target="${escapeHtml(item.key)}" data-url="${escapeHtml(item.url)}">
                            <i class="icon ${escapeHtml(item.icon)}"></i>
                            <span>${escapeHtml(item.title)}</span>
                        </div>
                    `;
                });
                html += `
                        </div>
                    </div>
                `;
            });

            container.html(html);

            // 绑定分组标题点击事件（展开/收缩）
            $('.group').on('click', function() {
                const isLocked = $(this).data('locked');
                if (isLocked) {
                    showToast('您没有权限访问此功能', 2000);
                    return;
                }

                const content = $(this).next('.nav-group-content');

                if (content.hasClass('expanded')) {
                    content.removeClass('expanded').addClass('collapsed');
                    content.css('max-height', '0px');
                    $(this).addClass('collapsed');
                } else {
                    content.removeClass('collapsed').addClass('expanded');
                    content.css('max-height', content.attr('data-expanded-height') + 'px');
                    $(this).removeClass('collapsed');
                }
            });

            // 绑定菜单项点击事件
            $('.item').on('click', function() {
                loadPage($(this).data('url'), $(this));
            });

            // 默认加载第一个有权限的页面（工作台 → 运营总览）
            const firstItem = userPermissions.menu[0]?.items[0];
            if (firstItem) {
                const $first = $('.item').first();
                loadPage(firstItem.url, $first);
            }
        }

        // 菜单不可用时如实显示占位信息，不再伪造一套有全部权限的菜单
        function renderEmptyMenu(message) {
            $('#navLinks').html(`
                <div style="padding:18px;color:rgba(255,255,255,0.65);font-size:12px;line-height:1.8;">
                    <i class="fas fa-info-circle"></i> ${escapeHtml(message)}
                </div>
            `);
            $('#contentIframe').attr('src', 'about:blank');
        }

        // 加载页面内容
        function loadPage(url, $item) {
            const safeUrl = safeMenuUrl(url);
            if (!safeUrl) {
                showToast('该菜单地址不合法，已阻止加载', 2500);
                return;
            }

            // 更新导航状态
            $('.item').removeClass('active');
            if ($item && $item.length) {
                $item.addClass('active');
                updateBreadcrumb($item.data('group'), $item.data('title'));
            } else {
                // iframe 内快捷入口跳转时，按 URL 找到对应导航项
                const $matched = $('.item').filter(function() {
                    return $(this).data('url') === safeUrl;
                }).first();
                if ($matched.length) {
                    $matched.addClass('active');
                    updateBreadcrumb($matched.data('group'), $matched.data('title'));
                } else {
                    updateBreadcrumb('工作台', '运营总览');
                }
            }

            $('#contentIframe').attr('src', safeUrl);
        }

        // 供子页面（如运营总览快捷入口）调用，保持导航与面包屑同步
        window.navigateTo = function(url, title) {
            const safeUrl = safeMenuUrl(url);
            if (!safeUrl) {
                return;
            }
            const $matched = $('.item').filter(function() {
                return $(this).data('url') === safeUrl;
            }).first();
            if ($matched.length) {
                loadPage(safeUrl, $matched);
            } else {
                $('.item').removeClass('active');
                updateBreadcrumb('工作台', title || '运营总览');
                $('#contentIframe').attr('src', safeUrl);
            }
        };

        function updateBreadcrumb(group, title) {
            $('#breadcrumb').html(`${escapeHtml(group || '工作台')} / <b>${escapeHtml(title || '运营总览')}</b>`);
        }

        // Toast 提示
        function showToast(message, duration = 2000) {
            let toast = $('#shellToast');
            if (!toast.length) {
                toast = $('<div class="toast" id="shellToast"></div>');
                $('body').append(toast);
            }
            toast.text(message).addClass('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => toast.removeClass('show'), duration);
        }

        function getCurrentUserName() {
            return sessionStorage.getItem('user_name') || null;
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                sessionStorage.clear();
                // 页面鉴权 Cookie 是 HttpOnly，只能由后端清除
                $.ajax({
                    url: '/api/sys_user/logout/',
                    method: 'POST'
                }).always(function() {
                    updateUserNameDisplay(null);
                    updateRoleDisplay('无角色');
                    renderEmptyMenu('已退出登录');
                    showToast('已成功退出登录', 1200);
                    // 退出后必须离开工作台，否则仍能看到上一个账号的页面内容
                    setTimeout(function() { window.location.href = '/login/'; }, 300);
                });
            }
        }

        function goToSettings() {
            showToast('系统设置功能开发中', 2000);
        }

        // 处理 iframe 内部点击关闭下拉菜单
        function setupIframeClickHandler() {
            const iframe = document.getElementById('contentIframe');
            if (iframe) {
                iframe.addEventListener('load', function() {
                    try {
                        // 页面鉴权 Cookie 失效时子页面会被重定向到登录页；
                        // 此时不能在 iframe 里嵌套展示登录页，必须让整个窗口回到登录页
                        if (iframe.contentWindow.location.pathname === '/login/') {
                            window.location.href = '/login/';
                            return;
                        }
                    } catch (e) {
                        console.log('无法读取 iframe 地址（可能跨域）');
                    }
                    try {
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        if (iframeDoc.__clickBound) {
                            return;
                        }
                        iframeDoc.__clickBound = true;
                        iframeDoc.addEventListener('click', function() {
                            hideUserDropdown();
                        });
                    } catch (e) {
                        console.log('无法访问 iframe 内容（可能跨域）');
                    }
                });
            }
        }

        // 页面加载完成后初始化
        $(document).ready(function() {
            // 未登录直接回登录页；token 附加与自动续期由 auth.js 统一处理
            const accessToken = sessionStorage.getItem('access_token');
            if (!accessToken) {
                window.location.href = '/login/';
                return;
            }

            updateCurrentDate();
            updateUserNameDisplay(getCurrentUserName());

            $(document).on('click', function(event) {
                if (!$(event.target).closest('.user-dropdown').length) {
                    hideUserDropdown();
                }
            });

            $('.user-dropdown-content').on('click', function(event) {
                event.stopPropagation();
            });

            setupIframeClickHandler();

            loadUserMenu().then(() => {
                $('#loadingOverlay').hide();
            });
        });
    </script>
</body>
</html>
