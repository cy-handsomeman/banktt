<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 银行柜面业务管理平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #16324f 0%, #245075 55%, #2f648c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #263445;
        }
        .login-wrap {
            width: 100%;
            max-width: 880px;
            min-height: 540px;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 70px rgba(6, 20, 34, 0.42);
            background: #fff;
        }
        .visual {
            background: linear-gradient(160deg, #1a3a5c, #24577f 60%, #2c6d9d);
            color: #fff;
            padding: 44px 42px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .visual::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            right: -120px;
            bottom: -100px;
        }
        .visual::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            left: -70px;
            top: 90px;
        }
        .visual-brand { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 650; letter-spacing: 0.4px; }
        .visual-brand i { font-size: 26px; }
        .visual-title { margin-top: 76px; font-size: 28px; font-weight: 650; line-height: 1.45; letter-spacing: 1px; }
        .visual-title small { display: block; font-size: 12px; font-weight: 400; color: #b8cfdf; letter-spacing: 2px; margin-top: 14px; }
        .visual-desc { margin-top: 22px; font-size: 12px; line-height: 1.9; color: #d0e0eb; max-width: 310px; }
        .visual-features { margin-top: auto; padding-top: 34px; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
        .visual-feature { display: flex; align-items: center; gap: 11px; font-size: 12px; color: #dbe8f1; }
        .visual-feature i {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.12);
            display: grid;
            place-items: center;
            font-size: 13px;
            color: #fff;
        }
        .panel { padding: 50px 48px; display: flex; flex-direction: column; justify-content: center; }
        .panel h1 { font-size: 21px; color: #1f3245; font-weight: 650; letter-spacing: 0.3px; }
        .panel .subtitle { font-size: 11px; color: #8a96a3; margin: 8px 0 30px; letter-spacing: 0.4px; }
        .field { margin-bottom: 18px; }
        .field label { display: block; margin-bottom: 7px; color: #52616f; font-size: 12px; font-weight: 550; }
        .field-input { position: relative; }
        .field-input i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa5b1;
            font-size: 12px;
        }
        .field-input input {
            width: 100%;
            padding: 11px 13px 11px 36px;
            border: 1px solid #d8dee5;
            border-radius: 7px;
            font: inherit;
            font-size: 13px;
            color: #263445;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
        }
        .field-input input:focus {
            outline: none;
            border-color: #2c6d9d;
            box-shadow: 0 0 0 3px rgba(44, 109, 157, 0.12);
        }
        .remember-row { display: flex; align-items: center; gap: 8px; margin: 4px 0 24px; }
        .remember-row input[type="checkbox"] { width: 14px; height: 14px; accent-color: #2c6d9d; cursor: pointer; }
        .remember-row label { color: #6b7785; font-size: 12px; cursor: pointer; }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #24577f, #2c6d9d);
            color: #fff;
            border: none;
            border-radius: 7px;
            font: inherit;
            font-size: 14px;
            font-weight: 550;
            letter-spacing: 2px;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
        }
        .login-btn:hover { filter: brightness(1.06); }
        .login-btn:active { transform: translateY(1px); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .message {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            display: none;
        }
        .message.error { background: #fdecec; color: #c24b4b; border: 1px solid #f3cdcd; display: block; }
        .message.success { background: #eaf6f0; color: #26815f; border: 1px solid #c7e7d8; display: block; }
        .panel-foot { margin-top: 26px; font-size: 10px; color: #a0abb6; text-align: center; line-height: 1.7; }
        @media (max-width: 780px) {
            .login-wrap { grid-template-columns: 1fr; max-width: 430px; min-height: auto; }
            .visual { display: none; }
            .panel { padding: 38px 30px; }
            body { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="visual">
            <div class="visual-brand">
                <i class="fas fa-university"></i>
                <span>银行柜面平台</span>
            </div>
            <div class="visual-title">
                轻量柜面<br>业务管理平台
                <small>BANK COUNTER MANAGEMENT</small>
            </div>
            <div class="visual-desc">
                面向柜面与运营场景的一体化工作台，覆盖客户、银行卡与交易流水管理。
            </div>
            <div class="visual-features">
                <div class="visual-feature"><i class="fas fa-chart-pie"></i><span>实时运营总览与交易趋势</span></div>
                <div class="visual-feature"><i class="fas fa-shield-alt"></i><span>管理员 / 柜员 / 查询员分级授权</span></div>
                <div class="visual-feature"><i class="fas fa-clock-rotate-left"></i><span>完整登录日志与操作留痕</span></div>
            </div>
        </div>
        <div class="panel">
            <h1>登录工作台</h1>
            <div class="subtitle">请输入账号密码，进入柜面业务管理平台</div>
            <form id="loginForm">
                <div class="field">
                    <label for="userName">用户名</label>
                    <div class="field-input">
                        <i class="fas fa-user"></i>
                        <input type="text" name="userName" id="userName" autocomplete="username" required placeholder="请输入用户名">
                    </div>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <div class="field-input">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" autocomplete="current-password" required placeholder="请输入密码">
                    </div>
                </div>
                <div class="remember-row">
                    <input type="checkbox" id="remember">
                    <label for="remember">记住用户名</label>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">登 录</button>
            </form>
            <div class="message" id="message"></div>
            <div class="panel-foot">仅限授权人员使用 · 登录行为将被记录</div>
        </div>
    </div>

    <script src="/static/js/jquery.min.js"></script>
    <script>
        $(function() {
            // 已经登录过（会话里还有 access token）就不再重复登录，直接回工作台
            if (sessionStorage.getItem('access_token')) {
                window.location.replace('/');
                return;
            }

            var savedUser = localStorage.getItem('savedUser');
            localStorage.removeItem('savedPass');  // 清理历史版本残留的明文密码
            if (savedUser) {
                $('#userName').val(savedUser);
                $('#remember').prop('checked', true);
            }

            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                var userName = $('#userName').val().trim();
                var password = $('#password').val();

                if (!userName) {
                    showMsg('请输入用户名', 'error');
                    return;
                }
                if (!password) {
                    showMsg('请输入密码', 'error');
                    return;
                }

                if ($('#remember').is(':checked')) {
                    localStorage.setItem('savedUser', userName);
                } else {
                    localStorage.removeItem('savedUser');
                }

                $('#loginBtn').prop('disabled', true).text('登 录 中...');

                $.ajax({
                    url: '/api/sys_user/login/',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        userName: userName,
                        password: password
                    }),
                    success: function(res) {
                        if (res.code === 0) {
                            showMsg('登录成功，正在跳转...', 'success');
                            sessionStorage.setItem('user_id', res.data.user_id);
                            sessionStorage.setItem('user_name', res.data.user_name);
                            sessionStorage.setItem('access_token', res.data.access);
                            sessionStorage.setItem('refresh_token', res.data.refresh);
                            // 页面层鉴权 Cookie 由后端在登录响应中下发（HttpOnly），前端不再自行写入
                            setTimeout(function() {
                                window.location.href = '/';
                            }, 500);
                        } else {
                            showMsg(res.message, 'error');
                        }
                    },
                    error: function(xhr) {
                        var res = xhr.responseJSON || {};
                        // 后端校验失败返回 message，限流/异常返回 detail，逐层兜底
                        var msg = res.message || res.detail || res.error;
                        if (!msg && xhr.status === 429) {
                            msg = '登录尝试过于频繁，请稍后再试';
                        }
                        if (!msg && xhr.status === 0) {
                            msg = '无法连接服务器，请检查网络';
                        }
                        if (!msg && xhr.status >= 500) {
                            msg = '服务器内部错误，请稍后重试';
                        }
                        showMsg(msg || '登录失败', 'error');
                    },
                    complete: function() {
                        $('#loginBtn').prop('disabled', false).text('登 录');
                    }
                });
            });

            function showMsg(text, type) {
                var $msg = $('#message');
                $msg.text(text).removeClass('error success').addClass(type);
            }
        });
    </script>
</body>
</html>
